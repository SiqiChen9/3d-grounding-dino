# 3D Grounding-DETR Configuration

data:
  dataset_path: /home/woody/iwi5/iwi5378h/rsna2023
  target_width: 128  # Target width (2nd dimension), other dimensions scale proportionally
  batch_size: 4
  num_workers: 12
  train_split: 0.7   # 70% for training
  val_split: 0.15    # 15% for validation
  test_split: 0.15   # 15% for testing
  random_seed: 0     # Fixed seed for reproducible splits
  augment: true   # Disable if overfitting test
  image_format: dcm # dcm for DICOM, jpeg for JPEG
  persistent_workers: true
  prefetch_factor: 2

model:
  num_classes: 5
  num_queries: 10
  hidden_dim: 256
  backbone_embed_dim: 96
  backbone_depths: [2, 2, 6, 2]
  backbone_num_heads: [3, 6, 12, 24]
  backbone_window_size: [7, 7, 7]
  num_encoder_layers: 6
  num_decoder_layers: 6
  num_heads: 8
  dim_feedforward: 2048
  dropout: 0.3    # Disable if overfitting test

training:
  epochs: 500
  lr: 0.0001
  weight_decay: 0.001  # Disable if overfitting test
  warmup_epochs: 5
  clip_max_norm: 10.0
  log_interval: 10
  val_interval: 5
  save_interval: 10

loss:
  cost_class: 2.0
  cost_bbox: 5.0
  cost_giou: 2.0
  weight_ce: 1.0
  weight_l1: 5.0
  weight_giou: 2.0
  eos_coef: 0.01

paths:
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
