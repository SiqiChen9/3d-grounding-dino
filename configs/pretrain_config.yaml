# Swin3D Backbone Pretraining Configuration
# Multi-label organ injury classification on full RSNA dataset (~2,873 patients)

data:
  dataset_path: /home/woody/iwi5/iwi5378h/rsna2023
  csv_file: train_2024.csv
  image_dir: train_images
  target_size: [128, 128, 128]  # Fixed volume size (D, H, W)
  batch_size: 4
  num_workers: 8
  train_split: 0.85
  random_seed: 42
  augment: true
  series_selection: first  # Use first series per patient
  persistent_workers: true
  prefetch_factor: 2
  # num_samples: 15  # Uncomment to limit dataset size for debugging

model:
  num_labels: 14       # 14 binary labels from train_2024.csv
  backbone_embed_dim: 96
  backbone_depths: [2, 2, 6, 2]
  backbone_num_heads: [3, 6, 12, 24]
  backbone_window_size: [7, 7, 7]
  patch_size: [4, 4, 4]
  mlp_ratio: 4.0
  dropout: 0.0
  attn_drop_rate: 0.0
  classifier_dropout: 0.3

training:
  epochs: 50
  lr: 0.00001
  weight_decay: 0.05
  warmup_epochs: 5
  clip_max_norm: 5.0
  val_interval: 5
  save_interval: 10

paths:
  checkpoint_dir: ./checkpoints/pretrain
  log_dir: ./logs/pretrain
