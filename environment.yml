name: 3d-detection
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.8
  - pip
  - pip:
      # --- Core ---
      - torch==2.1.0
      - numpy==1.24.4
      - scipy==1.10.1
      - scikit-learn==1.3.2
      - pandas==2.0.3

      # --- Medical imaging / data ---
      - monai==1.3.0
      - nibabel==5.1.0
      - pydicom>=2.4.0
      - opencv-python==4.12.0.88
      - pillow==10.4.0

      # --- Visualization / notebooks ---
      - matplotlib==3.7.5
      - jupyter==1.0.0
      - tqdm==4.65.2

      # --- Config / testing ---
      - PyYAML==6.0.1
      - pytest==7.4.4
